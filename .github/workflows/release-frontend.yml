name: Release Frontend

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Replace local backend URL with release placeholder
        run: |
          sed -i 's|https://m-stickers-back.loc/api/v1/|__BACKEND_URL__|g' dist/index.html

      - name: Archive dist bundle
        run: |
          cd dist
          zip -r "../sticky-picky-frontend-${GITHUB_REF_NAME}-dist.zip" .

      - name: Publish GitHub release artifact
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sticky-picky-frontend-${{ github.ref_name }}-dist.zip
